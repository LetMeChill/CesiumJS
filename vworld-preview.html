<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>미추홀구 · 브이월드 연동 검증</title>
    <script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=%VITE_VWORLD_API_KEY%"></script>
  </head>
  <body>
    <div id="vworld-map"></div>
    <aside class="preview-panel">
      <small>VWORLD · 연결 검증</small>
      <h1>미추홀구 실사 건물</h1>
      <p id="preview-status" role="status">3D 지도 연결 중…</p>
      <label><input id="heat-toggle" type="checkbox" disabled /> 관측 지표면온도 표시</label
      ><label for="preview-opacity">온도 불투명도 <output id="opacity-value">45%</output></label
      ><input id="preview-opacity" type="range" min="0" max="100" value="45" disabled />
      <div class="preview-actions">
        <button id="sk-view" disabled>인하대 · SK뷰</button
        ><button id="north-view" disabled>주안역 주변</button
        ><button id="whole-view" disabled>미추홀구 전체</button>
      </div>
      <p id="grid-info">지도에서 바닥을 클릭하면 격자 정보를 표시합니다.</p>
      <p class="preview-note">
        3D 배경: 브이월드 · 온도: 자체 관측 데이터<br />관측일 2026-06-16 · 30m 격자 / 원 열 관측 약
        100m<br />실사형 배경의 제작 시점과 온도 관측일은 다를 수 있습니다.
      </p>
      <a href="/">기존 지도 화면으로 돌아가기</a>
    </aside>
    <div id="preview-legend">
      <b>관측 지표면온도 (℃)</b>
      <div class="preview-gradient"></div>
      <div class="preview-ticks">
        <span>30</span><span>34</span><span>38</span><span>42</span><span>46</span><span>50</span>
      </div>
      <small>회색: 관측값 없음 · 도로별 정밀 온도가 아닙니다.</small>
    </div>
    <script type="module" src="/src/features/map/VworldPreview.ts"></script>
  </body>
</html>
